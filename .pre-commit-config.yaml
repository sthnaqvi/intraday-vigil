repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        # Non-negotiable given .env and token.json live under the state directory this
        # tree gitignores rather than never touches — this is the safety net for the
        # day someone accidentally stages one anyway.

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.4
    hooks:
      - id: ruff
        args: [--fix]
        # Deliberately no ruff-format hook here: this codebase has never been run through
        # it, and turning it on unreviewed would rewrite line-wrapping across the tree on
        # someone's first unrelated commit. Adopt it as its own deliberate change if ever.

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
